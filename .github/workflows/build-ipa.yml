name: Build Unsigned IPA

# 在 macOS runner 上编译出「未签名」的 .app，打成 .ipa，供 TrollStore / 巨魔 安装。
# 推 tag（v*）时自动创建 GitHub Release 并附上 ipa。

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: '手动触发时用于创建 Release 的 tag（留空则只产出 Artifact）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build QingLong.ipa
    runs-on: macos-14
    timeout-minutes: 45

    outputs:
      version: ${{ steps.meta.outputs.version }}
      artifact_name: ${{ steps.meta.outputs.artifact_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select latest stable Xcode
        run: |
          set -e
          echo "== available Xcodes =="
          ls /Applications | grep -i '^Xcode' || true
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST" ]; then
            sudo xcode-select -s "$LATEST/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      - name: Resolve version metadata
        id: meta
        run: |
          set -e
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(grep -m1 'MARKETING_VERSION:' project.yml \
              | sed -E 's/.*MARKETING_VERSION:[[:space:]]*"?([^"]*)"?.*/\1/' \
              | tr -d '[:space:]')
            [ -z "$VERSION" ] && VERSION="0.0.0"
            VERSION="${VERSION}+${{ github.run_number }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact_name=QingLong-${VERSION}-unsigned" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Install XcodeGen & ldid
        env:
          # 关闭 Homebrew 自动更新，runner 上 `brew update` 常需数分钟
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_ANALYTICS: 1
        run: |
          set -e
          brew install xcodegen ldid
          xcodegen --version
          ldid -v 2>&1 | head -n 3 || true

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml --use-cache

      - name: Resolve repository URL
        run: |
          set -e
          echo "QL_REPOSITORY_URL=https://github.com/${GITHUB_REPOSITORY}" >> "$GITHUB_ENV"

      - name: Build (unsigned, arm64)
        run: |
          set -o pipefail
          xcodebuild \
            -project QingLong.xcodeproj \
            -scheme QingLong \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            VALIDATE_PRODUCT=YES \
            MARKETING_VERSION="${{ steps.meta.outputs.version }}" \
            QL_REPOSITORY_URL="$QL_REPOSITORY_URL" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package IPA
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/QingLong.app"
          if [ ! -d "$APP" ]; then
            echo "::error::app bundle not found at $APP"
            find build/Build/Products -maxdepth 3 -print || true
            exit 1
          fi

          rm -rf Payload QingLong.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/

          # 可选：ldid 伪签名（部分 TrollStore 版本对完全未签名的二进制更挑剔）
          if command -v ldid >/dev/null 2>&1; then
            ldid -S Payload/QingLong.app/QingLong || true
            echo "ldid ad-hoc signed."
          fi

          # IPA 内不允许存在签名残留
          rm -rf Payload/QingLong.app/_CodeSignature Payload/QingLong.app/embedded.mobileprovision || true

          zip -qry QingLong.ipa Payload
          ls -lh QingLong.ipa

      - name: Verify IPA
        run: |
          set -e
          echo "== 包结构 =="
          unzip -l QingLong.ipa | head -n 25
          echo
          echo "== 主二进制架构 =="
          unzip -o -q QingLong.ipa -d .verify
          file .verify/Payload/QingLong.app/QingLong
          echo
          echo "== Info.plist 关键字段 =="
          plutil -p .verify/Payload/QingLong.app/Info.plist \
            | grep -E 'CFBundleIdentifier|CFBundleShortVersionString|CFBundleVersion|MinimumOSVersion|CFBundleDisplayName|CFBundleIcons|QLRepositoryURL' || true
          echo
          echo "== 图标是否编译进 Assets.car =="
          ls -la .verify/Payload/QingLong.app/ | grep -E 'Assets.car|AppIcon' || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: QingLong.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Upload dSYM (for crash symbolication)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: QingLong-dSYM-${{ steps.meta.outputs.version }}
          path: build/Build/Products/Release-iphoneos/*.dSYM
          if-no-files-found: ignore
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: Rename IPA
        run: |
          set -e
          mv dist/QingLong.ipa "dist/QingLong-${{ needs.build.outputs.version }}.ipa"
          ls -lh dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          name: QingLong iOS ${{ needs.build.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 青龙助手 iOS 客户端 ${{ needs.build.outputs.version }}

            未签名 IPA，适用于 **TrollStore / 巨魔** 环境。

            ### 安装方法
            1. 下载下方 `QingLong-${{ needs.build.outputs.version }}.ipa` 到设备（或用电脑传到设备）
            2. 打开 **TrollStore** → `+` / 「Install IPA」 → 选择该 ipa
            3. 首次启动后添加你的青龙面板地址（例如 `http://192.168.1.10:5700`）并登录

            > 该 IPA 为未签名包，由 TrollStore 在安装时自动签名。请勿使用 AltStore / Sideloadly 等需要证书的工具。
          files: |
            dist/*.ipa
